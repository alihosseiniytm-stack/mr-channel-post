name: hl-whales
# Wide Hyperliquid whale collector (public API, no key). Every 2 hours on purpose (a full pass of ~15k accounts takes ~75 min): GitHub's fair-use is respected (one job, ~7 requests/s against Hyperliquid's 20/s limit, 1 job at a time).
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch: {}
concurrency:
  group: hl-whales
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: collect
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          MIN_ACCT: "100000"
          MAX_WALLETS: "16000"
          RPS: "8"
        run: node collectors/hl-whales.mjs
