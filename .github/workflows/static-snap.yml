name: static-snap
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: static-snap
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: static-snap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --silent mongodb
      - run: node publish.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE: ${{ secrets.SUPABASE_SERVICE }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          NEON_URL: ${{ secrets.NEON_URL }}
          UPSTASH_URL: ${{ secrets.UPSTASH_URL }}
          UPSTASH_TOKEN: ${{ secrets.UPSTASH_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
      - run: mkdir -p public/vendor public/icons public/status && cp ../vendor/*.js public/vendor/ && cp icons/*.png public/icons/ && cp status/index.html public/status/index.html
      - run: npx --yes wrangler@4 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: publish to GitHub Pages (2nd static host, every 15 min; GitHub allows ~10 Pages builds/hour)
        run: |
          M=$(date -u +%M)
          if [ "${{ github.event_name }}" = "schedule" ] && [ $((10#$M % 15)) -ge 5 ]; then echo "skip (not a 15-min slot)"; exit 0; fi
          cd public && rm -f _headers && touch .nojekyll
          cp -rn ../../docs/. . 2>/dev/null || true   # keep the old /docs mirror URLs working (Pages source moved from main:/docs to gh-pages)
          git init -q -b gh-pages && git config user.name mr-snapshot && git config user.email mr-snapshot@users.noreply.github.com
          git add -A && git commit -q -m "snapshots $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
      - name: publish to Google Firebase Hosting (3 sites, every 15 min)
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          M=$(date -u +%M)
          if [ "${{ github.event_name }}" = "schedule" ] && [ $((10#$M % 15)) -ge 5 ]; then echo "skip (not a 15-min slot)"; exit 0; fi
          [ -n "$FIREBASE_SA" ] || { echo "no FIREBASE_SA"; exit 0; }
          mkdir -p ../fb && cp firebase/firebase.json firebase/.firebaserc ../fb/ && mkdir -p ../fb/public && cp -r public/. ../fb/public/ && rm -f ../fb/public/_headers && mkdir -p ../fb/public/trade && cp -r ../docs/trade/. ../fb/public/trade/
          printf %s "$FIREBASE_SA" > ../fb/sa.json
          cd ../fb && GOOGLE_APPLICATION_CREDENTIALS=$PWD/sa.json npx --yes firebase-tools@14 deploy --only hosting --project mr-mirror-61fd2 --non-interactive 2>&1 | tail -6
          rm -f sa.json
