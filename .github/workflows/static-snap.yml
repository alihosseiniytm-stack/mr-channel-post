name: static-snap
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write  # T30-15: dispatch mkt-snapshot (GitHub drops most */30 cron runs)
concurrency:
  group: static-snap
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    defaults:
      run:
        working-directory: static-snap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --silent mongodb
      - run: node publish.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE: ${{ secrets.SUPABASE_SERVICE }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          NEON_URL: ${{ secrets.NEON_URL }}
          UPSTASH_URL: ${{ secrets.UPSTASH_URL }}
          UPSTASH_TOKEN: ${{ secrets.UPSTASH_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: kick mkt-snapshot when its newest run is older than 28 min (GitHub drops most */30 cron runs; T30-15 2026-10-28)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T=$(gh api "repos/${{ github.repository }}/actions/workflows/mkt-snapshot.yml/runs?per_page=1" --jq ".workflow_runs[0].created_at" 2>/dev/null || echo "")
          AGE=$(( $(date -u +%s) - $(date -u -d "${T:-1970-01-01T00:00:00Z}" +%s) ))
          if [ "$AGE" -gt 1680 ]; then gh workflow run mkt-snapshot.yml -R "${{ github.repository }}" && echo "mkt-snapshot dispatched (last run ${AGE}s ago)"; else echo "mkt-snapshot ran ${AGE}s ago, ok"; fi
      - name: kick x-post (mode=live) when its newest run is older than 19 min (GitHub never fired its */20 cron; T50-09 fix-deploy-2 2026-10-30)
        # Plan B for the X poster: this job already runs every minute (Apps Script trigger). Plan C = the cron in x-post.yml. Double fire is safe:
        # x-post.yml has concurrency x-post and x_post.mjs keeps spacing >= 2 h + a daily cap. Checks only at minute % 10 < 3 (step runs 1-2 min after job start; <= 432 API reads/day, <= 72 dispatches/day).
        # Stop: repo variable X_KICK=off (X_POST_LIVE=false still keeps every run dry).
        if: ${{ vars.X_KICK != 'off' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ $(( 10#$(date -u +%M) % 10 )) -lt 3 ] || { echo "x-post kick: not a check minute"; exit 0; }
          T=$(gh api "repos/${{ github.repository }}/actions/workflows/x-post.yml/runs?per_page=1" --jq ".workflow_runs[0].created_at" 2>/dev/null || echo "")
          AGE=$(( $(date -u +%s) - $(date -u -d "${T:-1970-01-01T00:00:00Z}" +%s) ))
          if [ "$AGE" -gt 1140 ]; then gh workflow run x-post.yml -R "${{ github.repository }}" -f mode=live && echo "x-post kick: dispatched mode=live (last run ${AGE}s ago)"; else echo "x-post kick: last run ${AGE}s ago, ok"; fi
      - run: mkdir -p public/vendor public/icons public/status && cp ../vendor/*.js public/vendor/ && cp icons/*.png public/icons/ && cp status/index.html public/status/index.html
      - name: upload to mr-static (3 attempts, waits 20 s then 40 s; Cloudflare API blips 10013/10500 on assets-upload-session, FOLLOWUPS 84 + T10-35)
        run: |
          for W in 20 40 0; do
            npx --yes wrangler@4 deploy --config wrangler.jsonc && exit 0
            [ "$W" = 0 ] && break
            echo "::warning::mr-static upload failed, retry in $W s"
            sleep $W
          done
          echo "::error::mr-static upload failed 3 times"; exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: publish to GitHub Pages (2nd static host, every 15 min; GitHub allows ~10 Pages builds/hour)
        run: |
          M=$(date -u +%M)
          if [ $((10#$M % 15)) -ge 2 ]; then echo "skip (not a 15-min slot; the 1-minute Google trigger arrives as workflow_dispatch)"; exit 0; fi
          cd public && rm -f _headers && touch .nojekyll
          cp -rn ../../docs/. . 2>/dev/null || true   # keep the old /docs mirror URLs working (Pages source moved from main:/docs to gh-pages)
          git init -q -b gh-pages && git config user.name mr-snapshot && git config user.email mr-snapshot@users.noreply.github.com
          git add -A && git commit -q -m "snapshots $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
      - name: publish to Codeberg Pages (Iran-reachable reserve host; only when the owner has created the account + secrets CODEBERG_TOKEN, CODEBERG_REPO)
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_REPO: ${{ secrets.CODEBERG_REPO }}
        run: |
          M=$(date -u +%M)
          if [ $((10#$M % 15)) -ge 2 ]; then echo "skip (not a 15-min slot)"; exit 0; fi
          [ -n "$CODEBERG_TOKEN" ] && [ -n "$CODEBERG_REPO" ] || { echo "no Codeberg secrets yet"; exit 0; }
          rm -rf ../cb && mkdir -p ../cb && cp -r public/. ../cb/ && rm -f ../cb/_headers && cd ../cb
          git init -q -b pages && git config user.name mr-snapshot && git config user.email mr-snapshot@users.noreply.codeberg.org
          git add -A && git commit -q -m "snapshots $(date -u +%FT%TZ)"
          git push -q -f "https://${CODEBERG_REPO%%/*}:${CODEBERG_TOKEN}@codeberg.org/${CODEBERG_REPO}.git" pages || echo "codeberg push failed"
      - name: publish to Google Firebase Hosting (3 sites, every 15 min)
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          M=$(date -u +%M)
          if [ $((10#$M % 15)) -ge 2 ]; then echo "skip (not a 15-min slot)"; exit 0; fi
          [ -n "$FIREBASE_SA" ] || { echo "no FIREBASE_SA"; exit 0; }
          mkdir -p ../fb && cp firebase/firebase.json firebase/.firebaserc ../fb/ && mkdir -p ../fb/public && cp -r public/. ../fb/public/ && rm -f ../fb/public/_headers && mkdir -p ../fb/public/trade && cp -r ../docs/trade/. ../fb/public/trade/
          printf %s "$FIREBASE_SA" > ../fb/sa.json
          cd ../fb && GOOGLE_APPLICATION_CREDENTIALS=$PWD/sa.json npx --yes firebase-tools@14 deploy --only hosting --project mr-mirror-61fd2 --non-interactive 2>&1 | tail -6
          GOOGLE_APPLICATION_CREDENTIALS=$PWD/sa.json npx --yes firebase-tools@14 deploy --only hosting --project mr-mirror-two --non-interactive 2>&1 | tail -6 || true
          cd - >/dev/null && node firestore_sink.mjs ../fb/sa.json public/snap
          rm -f ../fb/sa.json
