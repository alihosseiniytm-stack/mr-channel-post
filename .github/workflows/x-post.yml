name: x-post
# X posts via Buffer (free plan API), EVENT-TRIGGERED: a whale opened/added >= $1M in the last 2 h -> shareNow (ramp cap/day, spacing >= 2 h, Buffer request counter stop at 80/day).
# SWITCH IS OFF: the schedule below is COMMENTED OUT and live mode also needs repo variable X_POST_LIVE=true. To go live: uncomment the cron AND set X_POST_LIVE=true.
on:
  # schedule:
  #   - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: dry | draft | live | extra-pinned | extra-weekly | drafts-list | drafts-delete
        default: dry
      n:
        description: posts in this run
        default: "1"
      min:
        description: min opened USD (default 1000000)
        default: "1000000"
      thread:
        description: "draft/live: make the LAST post a thread (main without link + reply with the whale link): true|false"
        default: "false"
      ids:
        description: drafts-delete only, space separated Buffer post ids
        default: ""
permissions:
  contents: write
concurrency: x-post
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: drafts helper
        if: startsWith(github.event.inputs.mode, 'drafts-')
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: |
          M="${{ github.event.inputs.mode }}"; M="${M#drafts-}"
          node x_drafts.mjs "$M" ${{ github.event.inputs.ids }}
      - run: npm ci
        if: "!startsWith(github.event.inputs.mode, 'drafts-')"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-noto-color-emoji
        if: "!startsWith(github.event.inputs.mode, 'drafts-')"
      - run: npx playwright-core install --with-deps chromium
        if: "!startsWith(github.event.inputs.mode, 'drafts-')"
      - name: post
        if: "!startsWith(github.event.inputs.mode, 'drafts-')"
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          X_POST_LIVE: ${{ vars.X_POST_LIVE }}
        run: |
          git config user.name "x-post-bot"; git config user.email "bot@users.noreply.github.com"
          MODE="${{ github.event.inputs.mode || 'live' }}"
          case "$MODE" in extra-*) node x_extra.mjs draft "${MODE#extra-}"; exit 0;; esac
          node x_post.mjs $([ "${{ github.event.inputs.thread }}" = true ] && echo --thread) --n "${{ github.event.inputs.n || 1 }}" --mode "$MODE" --min "${{ github.event.inputs.min || 1000000 }}" $([ "$MODE" = dry ] || echo --save)
      - name: save state
        if: "!startsWith(github.event.inputs.mode, 'drafts-')"
        run: |
          git add x_history.json x_state.json x-img || true
          git commit -m "x state $(date -u +%FT%TZ)" || exit 0
          git pull --rebase && git push
