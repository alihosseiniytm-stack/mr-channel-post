name: ws-test
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          cat > t.mjs <<'EOF'
          const variants = { A_oneCoin: { coins: ["BTC"], gap: 0, ping: 0 }, B_staggered12: { coins: ["BTC","ETH","SOL","HYPE","XRP","DOGE","SUI","BNB","AVAX","LINK","ARB","PEPE"], gap: 150, ping: 0 }, C_ping: { coins: ["BTC","ETH"], gap: 0, ping: 8000 } };
          for (const [name, v] of Object.entries(variants)) {
            await new Promise((done) => {
              const t0 = Date.now(); let n = 0, trades = 0, live = 0; const ws = new WebSocket("wss://api.hyperliquid.xyz/ws"); let pt = null; let closed = false;
              ws.onopen = () => { v.coins.forEach((c, i) => setTimeout(() => { try { ws.send(JSON.stringify({ method: "subscribe", subscription: { type: "trades", coin: c } })); } catch (e) {} }, i * v.gap)); if (v.ping) pt = setInterval(() => { try { ws.send(JSON.stringify({ method: "ping" })); } catch (e) {} }, v.ping); };
              ws.onmessage = (e) => { n++; try { const m = JSON.parse(e.data); if (m.channel === "trades") for (const t of m.data) { trades++; if (Date.now() - t.time < 5000) live++; } } catch (x) {} };
              const fin = (why) => { if (closed) return; closed = true; if (pt) clearInterval(pt); console.log(name, why, "after", Date.now() - t0, "ms msgs", n, "trades", trades, "fresh<5s", live); done(); };
              ws.onclose = (e) => fin("closed " + e.code);
              setTimeout(() => { fin("alive at 20s"); try { ws.close(); } catch (e) {} }, 20000);
            });
          }
          process.exit(0);
          EOF
          node t.mjs
