name: flood-probe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          START=$(date +%s)
          seq 1 600 | xargs -P 150 -I{} curl -s -o /dev/null -w "%{http_code}\n" "https://marketradarwhale.com/robots.txt?f={}" | sort | uniq -c | sed 's/^/FLOOD /'
          echo "FLOOD took $(( $(date +%s) - START )) s"
          curl -s -o /dev/null -w "FLOOD right after: %{http_code}\n" "https://marketradarwhale.com/robots.txt"
          sleep 14
          curl -s -o /dev/null -w "FLOOD 14s later: %{http_code}\n" "https://marketradarwhale.com/robots.txt"
