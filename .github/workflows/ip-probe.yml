name: ip-probe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "runner IP as the domain sees it:"; curl -s https://marketradarwhale.com/cdn-cgi/trace | grep -E "^ip="
          for i in 1 2 3; do curl -s -o /dev/null -w "runner POST /web-auth-challenge via DOMAIN -> %{http_code}\n" -X POST https://marketradarwhale.com/web-auth-challenge -H "content-type: application/json" -d '{}'; done
