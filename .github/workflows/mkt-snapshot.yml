name: mkt-snapshot
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node mkt-snap.mjs
      - run: |
          git config user.name "mr-snapshot"
          git config user.email "mr-snapshot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "market snapshot" && git push)
