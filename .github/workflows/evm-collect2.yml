name: evm-collect-2
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node collectors/evm.mjs
        env:
          INGEST_URL: https://whale-alert-bot.alihosseini-ytm.workers.dev/evm-ingest https://marketradarwhale.com/evm-ingest
          INGEST_KEY: ${{ secrets.EVM_INGEST_KEY2 }}
